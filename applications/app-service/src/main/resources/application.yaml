server:
  port: 8081
spring:
  application:
    name: "LoanService"
  devtools:
    add-properties: false
  sql:
    init:
      mode: always
      schema-locations: classpath:/migrations/schema.sql
      data-locations: classpath:/migrations/data.sql
  profiles:
    include:
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

adapters:
  r2dbc:
    host: localhost
    port: 5432
    database: loan-db
    schema: public
    username: admin
    password: admin